[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stratios-edge-ai"
version = "0.1.0"
description = "Raspberry Pi edge AI experiments for vision, voice, and multimodal systems"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
edge-camera-server = "stratios_edge_ai.private_camera.cli:serve"
edge-camera-admin = "stratios_edge_ai.private_camera.cli:admin"
edge-camera-pi-agent = "stratios_edge_ai.private_camera.pi_agent:main"
edge-camera-pi-live = "stratios_edge_ai.private_camera.pi_live:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8",
  "ruff>=0.6",
]
private-camera = [
  "argon2-cffi>=23.1",
  "fastapi>=0.115",
  "httpx>=0.28",
  "uvicorn[standard]>=0.34",
]
pi-camera = [
  "picamera2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stratios_edge_ai.private_camera" = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
