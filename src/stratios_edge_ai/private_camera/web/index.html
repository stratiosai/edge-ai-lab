<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#091018">
    <title>Edge Camera</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <main>
      <section id="login-card" class="card login-card">
        <p class="eyebrow">STRATIOSAI · LOCAL CAMERA</p>
        <h1>Private camera</h1>
        <p class="muted">Sign in to view local video and recordings.</p>
        <form id="login-form">
          <label>Username<input id="username" autocomplete="username" required></label>
          <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
          <button type="submit">Sign in</button>
          <p id="login-error" class="error" role="alert"></p>
        </form>
      </section>

      <section id="dashboard" hidden>
        <header>
          <div><p class="eyebrow">EDGE-AI-PI</p><h1>Camera overview</h1></div>
          <div class="header-actions">
            <button id="logout-all" class="secondary">Log out all devices</button>
            <button id="logout" class="secondary">Log out</button>
          </div>
        </header>
        <div class="status-grid">
          <article class="card"><span>Server</span><strong id="server-status">Checking…</strong></article>
          <article class="card"><span>Camera</span><strong id="camera-status">Checking…</strong></article>
          <article class="card"><span>Archive</span><strong id="archive-size">Checking…</strong></article>
        </div>
        <p id="health-detail" class="muted health-detail" aria-live="polite"></p>
        <article class="card live-card">
          <div class="section-title"><h2>Live</h2><span>720p target</span></div>
          <div class="video-shell"><img id="live-view" alt="Authenticated live camera view"></div>
        </article>
        <article class="card">
          <div class="section-title"><h2>Last 24 hours</h2><button id="refresh" class="secondary">Refresh</button></div>
          <div id="timeline" class="timeline"></div>
        </article>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
